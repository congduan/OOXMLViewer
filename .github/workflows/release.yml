name: Release

# 推送 v* 标签（如 v0.1.0）时，构建三平台安装包并创建 GitHub Release（草稿）。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        # 同时构建 Intel 与 Apple Silicon 的 macOS 通用包
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # macOS 通用包需要交叉编译目标
          targets: 'aarch64-apple-darwin,x86_64-apple-darwin'

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'OOXML Viewer ${{ github.ref_name }}'
          releaseBody: |
            请从下方 Assets 下载对应平台的安装包。

            - **macOS**：`.dmg` / `.app`
            - **Windows**：`.msi` / `.exe`
            - **Linux**：`.deb` / `.AppImage`

            如需发布正式版，请在 Release 页面去掉"草稿"标记。
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
